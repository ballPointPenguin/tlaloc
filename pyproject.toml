[project]
name = "tlaloc"
version = "0.1.0"
description = "Daily synoptic pattern analysis for North America via Claude AI, published to GitHub Pages"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tlaloc = "tlaloc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
