name: Daily Synoptic Analysis

on:
  workflow_dispatch:
  schedule:
    # Daily after the 12Z upper-air analyses are published
    - cron: "30 13 * * *"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      # On pull requests, verify all data sources are reachable without
      # spending API tokens or modifying the page.
      - name: Check data sources
        if: github.event_name == 'pull_request'
        run: uv run python -m tlaloc --collect-only

      - name: Run synoptic analysis
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m tlaloc

      - name: Commit and push
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily synoptic analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${{ github.ref_name }}
