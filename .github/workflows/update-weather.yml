name: Daily Synoptic Analysis

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Full run with Claude calls, but upload the result as an artifact instead of committing"
        type: boolean
        default: false
      collect_only:
        description: "Only check data sources (no Claude calls, no commit)"
        type: boolean
        default: false
  schedule:
    # Daily after the 12Z upper-air analyses are published
    - cron: "30 13 * * *"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Lint and test
        if: github.event_name == 'pull_request'
        run: |
          uv run ruff check .
          uv run pytest

      # On pull requests (and collect-only dispatches), verify all data
      # sources are reachable without spending API tokens or modifying the page.
      - name: Check data sources
        if: github.event_name == 'pull_request' || inputs.collect_only == true
        run: uv run python -m tlaloc --collect-only

      - name: Dry run (nothing committed)
        if: inputs.dry_run == true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m tlaloc --dry-run

      - name: Upload dry-run output
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v7
        with:
          name: tlaloc-dry-run
          path: .dry-run/

      - name: Run synoptic analysis
        if: github.event_name != 'pull_request' && inputs.collect_only != true && inputs.dry_run != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m tlaloc

      - name: Commit and push
        if: github.event_name != 'pull_request' && inputs.collect_only != true && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/ archive/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: daily synoptic analysis $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${{ github.ref_name }}
